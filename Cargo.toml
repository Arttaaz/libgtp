[package]
name = "libgtp"
version = "0.1.3"
authors = ["Arttaaz <arttaaz@gmail.com>"]
edition = "2021"
description = "A library implmenting the gtp protocol"
license-file = "LICENSE"

[features]
default = ["controller"]
controller = []
serde = ["dep:serde"]

[dependencies]
log = "0.4"
scrub_log = "0.2.1"
serde = { version = "1.0", features = ["derive"], optional = true}

